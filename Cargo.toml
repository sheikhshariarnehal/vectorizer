[workspace]
members = [
    "crates/vectorizer-core",
    "crates/vectorizer-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
