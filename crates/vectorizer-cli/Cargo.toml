[package]
name = "vectorizer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line runner and benchmark harness for vectorizer-core."

[[bin]]
name = "vectorizer"
path = "src/main.rs"

[dependencies]
vectorizer-core = { path = "../vectorizer-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rayon = "1.10"
